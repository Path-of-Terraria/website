name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - staging

env:
  CONTAINER_REGISTRY: registry.digitalocean.com
  DOCKERFILE_PATH: '**/Dockerfile'
  DOCKER_CREDS: ${{ secrets.CI_DIGITAL_OCEAN_DEPLOYS }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      -   name: Set IMAGE_REPOSITORY based on branch
          id: set_repo
          run: |
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo "IMAGE_REPOSITORY=path-of-terraria/website" >> $GITHUB_ENV
            elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
              echo "IMAGE_REPOSITORY=path-of-terraria/website-qa" >> $GITHUB_ENV
            fi


      - name: Set BUILD_CONFIG based on branch
        id: set_build_config
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "NODE_ENV=production" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "NODE_ENV=staging" >> $GITHUB_ENV
          fi

      -   name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

      -   name: Setup pnpm
          uses: pnpm/action-setup@v4

      -   name: Use Node.js 24.x
          uses: actions/setup-node@v5
          with:
            node-version: '24'

      -   name: Run pnpm install
          run: pnpm i

      -   name: Run pnpm build
          run: pnpm run build

      -   name: Login to Docker registry
          uses: docker/login-action@v3
          with:
            registry: ${{ env.CONTAINER_REGISTRY }}
            username: ${{ env.DOCKER_CREDS }}
            password: ${{ env.DOCKER_CREDS }}

      -   name: Build and push Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: |
              ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ github.run_id }}
              ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:latest
